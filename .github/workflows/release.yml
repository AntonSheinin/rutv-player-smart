name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  release:
    name: Build and publish release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Validate release tag and changelog
        shell: pwsh
        run: ./scripts/validate-release-state.ps1 -ReleaseTag '${{ github.ref_name }}'

      - name: Validate tag is on default branch
        shell: bash
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"

      - name: Build release APK
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew :app:clean :app:testReleaseUnitTest :app:assembleRelease --console=plain

      - name: Read version
        id: version
        shell: pwsh
        run: |
          $props = @{}
          Get-Content version.properties | ForEach-Object {
            if ($_ -match '^\s*([^#][^=]+?)\s*=\s*(.*?)\s*$') {
              $props[$matches[1].Trim()] = $matches[2].Trim()
            }
          }
          "version=$($props.VERSION_NAME)" >> $env:GITHUB_OUTPUT
          "apk=app/build/outputs/apk/release/rutv-release-$($props.VERSION_NAME).apk" >> $env:GITHUB_OUTPUT

      - name: Verify APK exists
        shell: bash
        run: |
          test -s "${{ steps.version.outputs.apk }}"

      - name: Extract release notes
        shell: pwsh
        run: |
          $version = '${{ steps.version.outputs.version }}'
          $text = Get-Content CHANGELOG.md -Raw
          $escaped = [regex]::Escape($version)
          $match = [regex]::Match($text, "(?ms)^## \[$escaped\] - \d{4}-\d{2}-\d{2}\s*(.*?)(?=^## \[|\z)")
          if (!$match.Success) {
            throw "No changelog section found for $version"
          }
          $notes = $match.Groups[1].Value.Trim()
          if ($notes.Length -eq 0) {
            $notes = "Release $version"
          }
          Set-Content -LiteralPath release-notes.md -Value $notes -Encoding utf8

      - name: Create or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
          APK_PATH: ${{ steps.version.outputs.apk }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --notes-file release-notes.md
          else
            gh release create "$TAG_NAME" --title "$TAG_NAME" --notes-file release-notes.md
          fi
          gh release upload "$TAG_NAME" "$APK_PATH" --clobber

      - name: Upload release APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: rutv-release-${{ steps.version.outputs.version }}
          path: ${{ steps.version.outputs.apk }}
          if-no-files-found: error

      - name: Upload APK to hetzner2
        shell: bash
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER }}
          HETZNER_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
          HETZNER_APK_DIR: ${{ secrets.HETZNER_APK_DIR }}
          APK_PATH: ${{ steps.version.outputs.apk }}
        run: |
          : "${HETZNER_HOST:?HETZNER_HOST secret is required}"
          : "${HETZNER_USER:?HETZNER_USER secret is required}"
          : "${HETZNER_SSH_KEY:?HETZNER_SSH_KEY secret is required}"
          DEST_DIR="${HETZNER_APK_DIR:-/home/anton/playlist_service/apks}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$HETZNER_SSH_KEY" > ~/.ssh/hetzner_key
          chmod 600 ~/.ssh/hetzner_key
          ssh-keyscan -H "$HETZNER_HOST" >> ~/.ssh/known_hosts
          ssh -i ~/.ssh/hetzner_key "${HETZNER_USER}@${HETZNER_HOST}" "mkdir -p '$DEST_DIR'"
          scp -i ~/.ssh/hetzner_key "$APK_PATH" "${HETZNER_USER}@${HETZNER_HOST}:$DEST_DIR/"
          REMOTE_PATH="$DEST_DIR/$(basename "$APK_PATH")"
          ssh -i ~/.ssh/hetzner_key "${HETZNER_USER}@${HETZNER_HOST}" "test -s '$REMOTE_PATH' && ls -lh '$REMOTE_PATH'"
