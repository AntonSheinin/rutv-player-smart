plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
    id 'com.google.devtools.ksp'
    id 'com.google.dagger.hilt.android'
}

def versionPropertiesFile = rootProject.file('version.properties')
def versionProperties = new Properties()
if (!versionPropertiesFile.exists()) {
    throw new GradleException("Missing version.properties at repository root")
}
versionPropertiesFile.withInputStream { versionProperties.load(it) }

android {
    namespace 'com.rutv'
    compileSdk 35

    defaultConfig {
        applicationId "com.rutv"
        minSdk 24
        targetSdk 35
        versionCode versionProperties.getProperty('VERSION_CODE').toInteger()
        versionName versionProperties.getProperty('VERSION_NAME')
    }

    signingConfigs {
        debug {
            storeFile file('../debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            signingConfig signingConfigs.debug
            manifestPlaceholders = [usesCleartextTraffic: "true"]
        }
        release {
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
    }

    applicationVariants.all { variant ->
        variant.outputs.all {
            outputFileName = "rutv-${variant.name}-${variant.versionName}.apk"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }
    buildFeatures.buildConfig = true

    // Compose compiler version managed by Kotlin Compose plugin and BOM

    packagingOptions {
        jniLibs {
            useLegacyPackaging = true
        }
    }
}

composeCompiler {
    reportsDestination = layout.buildDirectory.dir("compose_compiler")
    metricsDestination = layout.buildDirectory.dir("compose_compiler")
}

ksp {
    arg("room.schemaLocation", "$projectDir/schemas")
}

dependencies {
    coreLibraryDesugaring libs.desugar.jdk
    implementation libs.androidx.core.ktx
    implementation libs.androidx.appcompat

    // Jetpack Compose
    implementation platform(libs.compose.bom)
    implementation libs.compose.ui
    implementation libs.compose.ui.graphics
    implementation libs.compose.ui.tooling.preview
    implementation libs.compose.material3
    implementation libs.compose.material.icons.ext
    debugImplementation libs.compose.ui.tooling
    debugImplementation libs.compose.ui.test.manifest

    // Compose integration with Activities
    implementation libs.activity.compose
    implementation libs.lifecycle.viewmodel.compose
    implementation libs.lifecycle.runtime.compose

    // Media3 - ExoPlayer
    implementation libs.media3.exoplayer
    implementation libs.media3.ui
    implementation libs.media3.common
    implementation libs.media3.hls

    // FFmpeg decoder
    implementation libs.nextlib.media3ext

    // Lifecycle & ViewModel
    implementation libs.lifecycle.runtime.ktx
    implementation libs.lifecycle.viewmodel.ktx

    // Coroutines
    implementation libs.coroutines.core
    implementation libs.coroutines.android

    // Immutable collections for Compose stability
    implementation libs.kotlinx.collections.immutable

    // Room Database
    implementation libs.room.runtime
    implementation libs.room.ktx
    ksp libs.room.compiler

    // Hilt Dependency Injection
    implementation libs.hilt.android
    ksp libs.hilt.compiler

    // DataStore
    implementation libs.datastore.prefs

    // Image loading for Compose
    implementation libs.coil.compose
    implementation libs.coil.gif

    // JSON
    implementation libs.gson

    // Timber for logging
    implementation libs.timber

    testImplementation libs.junit
}
